[project]
name = "opengray"
version = "0.0.1"
description = "An open environment and benchmark for agentic radiotherapy treatment planning."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Humza Nusrat" }]
keywords = ["radiotherapy", "treatment planning", "benchmark", "llm agents", "medical physics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13.0",
  "plotly>=5.20",
  "pyarrow>=15.0",
  "httpx>=0.27",
  "mcp>=2.0",
  "optuna>=4.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
paper = ["matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
opengray = "opengray.cli:app"

[project.urls]
Homepage = "https://github.com/hnusrat1/opengray"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opengray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "data: tests that need the OpenKBP-Opt cache on disk (skipped in CI)",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
